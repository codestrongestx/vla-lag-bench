[project]
name = "vlalagbench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Versions follow third_party/openpi/examples/libero/requirements.txt where
    # Python 3.11 / macOS wheels exist; deviations are noted.
    "bddl==1.0.1",
    "cloudpickle>=2.1",  # libero.libero.envs.venv
    "easydict>=1.13",
    "future>=1.0",  # undeclared runtime dependency of bddl 1.0.1
    "gym==0.25.2",  # libero.libero.envs.venv; LIBERO's pinned version
    "matplotlib>=3.7",  # libero.libero.envs.env_wrapper; LIBERO pins 3.5.3 (no 3.11 wheels)
    "torch>=2.2,<2.6",  # libero benchmark loads init states via torch.load; >=2.6 defaults weights_only=True and rejects them
    "imageio==2.35.1",
    "imageio-ffmpeg==0.5.1",
    "mujoco==3.2.3",
    "numba==0.57.1",  # openpi pins 0.53.1, which has no 3.11 support
    "numpy==1.23.5",  # openpi pins 1.22.4, which has no 3.11 wheels
    "openpi-client",
    "opencv-python>=4.8",  # openpi pins 4.6.0.66, which has no 3.11 wheels
    "pydantic>=2.12,<3",
    "pyyaml==6.0.2",
    "robosuite==1.4.1",
    "scipy==1.10.1",
    "tqdm==4.67.1",
]

[project.scripts]
vlalagbench = "vlalagbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlalagbench"]

[tool.uv]
package = true

[tool.uv.sources]
openpi-client = { path = "third_party/openpi/packages/openpi-client" }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests", "analysis/tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]

# One GPU with four environment workers and rendering on the same GPU.
# Edit the GPU, ports, CPU set, and interpreter for the evaluation host.
schema_version: 1
host: local
gpu_budget: 1
shards:
  - {policy_gpu: 0, port: 8100, cpus: "0-7"}
render_gpu: 0
policy_memory_fraction: 0.5
workers_per_shard: 4
policy_python: third_party/openpi/.venv/bin/python
output_root: studies

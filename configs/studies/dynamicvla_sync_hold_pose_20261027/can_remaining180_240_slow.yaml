# Ribbed moving can, remaining 180 episodes, synchronous 240 ms at 0.025-0.1 m/s, rerun with the arm holding its pose during waits.
schema_version: 2
name: fcan04-moving-can-ribbed-remaining180-750steps-sync240-idle-control
base_experiment: configs/studies/fcan04_moving_can_remaining180_20261008/base.yaml
sweep:
  trajectory.speed_mps:
  - 0.025
  - 0.05
  - 0.075
  - 0.1
override:
  inference.mode: synchronous
  inference.latency_ms: 240
policy:
  kind: dynamicvla
  antialiasing_mode: DLSS
  dlss_mode: Balanced
  enable_dl_denoiser: true
  enable_dlssg: false
  render_mode: RaytracedLighting
order:
- trajectory.speed_mps: descending

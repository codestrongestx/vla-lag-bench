schema_version: 3
kind: dynamicvla
name: dynamicvla-local

dynamicvla_root: /srv/dynamicvla/source
assets_root: /srv/dynamicvla/assets
simulator_python: /srv/dynamicvla/envs/isaac/bin/python
policy_python: /srv/dynamicvla/envs/policy/bin/python
host: 127.0.0.1
image_port: 3186
action_port: 3188
startup_timeout_s: 900.0
reply_timeout_s: 300.0
suite_timeout_s: 86400.0
save_videos: false
simulator_library_paths: []

antialiasing_mode: DLSS
dlss_mode: Balanced
enable_dl_denoiser: true
enable_dlssg: false
render_mode: RaytracedLighting
